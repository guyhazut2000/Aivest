version: '3.8'

services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: aivest-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    command: npm run dev

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aivest-prod
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    command: npm start

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: aivest-test
    environment:
      NODE_ENV: test
    volumes:
      - .:/app
      - /app/node_modules
