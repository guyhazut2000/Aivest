# CI: lint, typecheck, and build on every push/PR to main (or master).
# CD: Vercel production on main after checks pass. Branch previews: Vercel plugin in Cursor
#     (/vercel-plugin:deploy) or Vercel PR previews when the GitHub integration is connected.
# See context/05-deploy.md. Prisma job runs only when prisma/schema.prisma exists.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3000/api

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  prisma:
    name: Prisma validate, generate & migrate
    needs: quality
    if: hashFiles('frontend/prisma/schema.prisma') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate schema
        working-directory: frontend
        run: npx prisma validate

      - name: Generate client
        working-directory: frontend
        run: npx prisma generate

      - name: Apply migrations
        working-directory: frontend
        run: npx prisma migrate deploy

      - name: Migration status
        working-directory: frontend
        run: npx prisma migrate status

      - name: Schema matches migrations (no drift)
        working-directory: frontend
        run: >
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
