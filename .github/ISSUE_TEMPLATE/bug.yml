name: Bug
description: Something is broken
title: "[Bug]: "
labels:
  - type:bug
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: task_file
    attributes:
      label: Task spec path (optional)
      placeholder: context/tasks/fix-login.md
